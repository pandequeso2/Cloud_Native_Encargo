server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: notas_service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/microservicios_notas?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      properties:
        enable.idempotence: true
        acks: all

eureka:
  client:
    eureka-server-http-client-name: RestClient
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api/v1/notas/v3/api-docs
  group-configs:
    - group: notas
      paths-to-match: /api/v1/notas/**
    - group: ponderaciones
      paths-to-match: /api/v1/ponderaciones/**

app:
  kafka:
    topics:
      grades-input: academic-grades-input

