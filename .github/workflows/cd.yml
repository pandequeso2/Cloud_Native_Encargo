name: Deploy to AWS

on:
  push:
    branches: [Develop]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: cloudnative-encargo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: eureka-server, path: Backend/eureka-server }
          - { name: gateway, path: Backend/gateway }
          - { name: notas-service, path: Backend/notas_service }
          - { name: asignaturas-service, path: Backend/asignaturas_service }
          - { name: profesores-service, path: Backend/profesores_service }
          - { name: grupos-service, path: Backend/grupos_service }
          - { name: integrantes-service, path: Backend/integrantes_service }
          - { name: roles-service, path: Backend/roles_service }
          - { name: secciones-service, path: Backend/secciones_service }
          - { name: trabajos-service, path: Backend/trabajos_service }
          - { name: entregas-service, path: Backend/entregas_service }
          - { name: comentarios-service, path: Backend/comentarios_service }
          - { name: frontend, path: Frontend }

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.service.name != 'frontend'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar jar
        if: matrix.service.name != 'frontend'
        working-directory: ${{ matrix.service.path }}
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen
        working-directory: ${{ matrix.service.path }}
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ env.PROJECT_NAME }}-${{ matrix.service.name }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_AUDIENCE: ${{ secrets.ENTRA_AUDIENCE }}
        run: |
          docker build \
            --build-arg VITE_ENTRA_TENANT_ID=$ENTRA_TENANT_ID \
            --build-arg VITE_ENTRA_AUDIENCE=$ENTRA_AUDIENCE \
            --build-arg VITE_REDIRECT_URI="http://localhost:3000" \
            --build-arg VITE_API_BASE_URL="http://localhost:8095" \
            -t $REGISTRY/$REPO:latest -t $REGISTRY/$REPO:${{ github.sha }} .
          docker push $REGISTRY/$REPO:latest
          docker push $REGISTRY/$REPO:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar docker-compose.prod.yml al Backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu"

      - name: Desplegar en el Backend (EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,ENTRA_TENANT_ID,ENTRA_AUDIENCE,DB_HOST,DB_USERNAME,DB_PASSWORD,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          script: |
            set -e
            
            sudo mkdir -p /home/ubuntu/app
            sudo chown -R ubuntu:ubuntu /home/ubuntu/app
            mv /home/ubuntu/docker-compose.prod.yml /home/ubuntu/app/docker-compose.yml
            
            cd /home/ubuntu/app
            cat <<EOF > .env
            ECR_REGISTRY=${ECR_REGISTRY}
            ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
            ENTRA_AUDIENCE=${ENTRA_AUDIENCE}
            DB_HOST=${DB_HOST}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            EOF
            
            which aws || (sudo apt-get update && sudo apt-get install -y awscli)
            
            # Inyectar credenciales temporalmente para el pull
            export AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            export AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            export AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
            
            aws ecr get-login-password --region ${AWS_REGION} | \
              sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}
              
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_AUDIENCE: ${{ secrets.ENTRA_AUDIENCE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Desplegar en el Frontend (EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          script: |
            set -e
            
            which aws || (sudo apt-get update && sudo apt-get install -y awscli)
            
            export AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            export AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            export AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
            
            aws ecr get-login-password --region ${AWS_REGION} | \
              sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}
            
            sudo docker pull ${ECR_REGISTRY}/cloudnative-encargo-frontend:latest
            sudo docker rm -f frontend || true
            sudo docker run -d --name frontend -p 80:80 ${ECR_REGISTRY}/cloudnative-encargo-frontend:latest
            
            sudo docker image prune -f
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}