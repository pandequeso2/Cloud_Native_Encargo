name: Deploy to AWS

on:
  push:
    branches: [Develop]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: cloudnative-encargo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: eureka-server, path: Backend/eureka-server }
          - { name: gateway, path: Backend/gateway }
          - { name: notas-service, path: Backend/notas_service }
          - { name: asignaturas-service, path: Backend/asignaturas_service }
          - { name: profesores-service, path: Backend/profesores_service }
          - { name: grupos-service, path: Backend/grupos_service }
          - { name: integrantes-service, path: Backend/integrantes_service }
          - { name: roles-service, path: Backend/roles_service }
          - { name: secciones-service, path: Backend/secciones_service }
          - { name: trabajos-service, path: Backend/trabajos_service }
          - { name: entregas-service, path: Backend/entregas_service }
          - { name: comentarios-service, path: Backend/comentarios_service }
          - { name: frontend, path: Frontend }

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.service.name != 'frontend'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar jar
        if: matrix.service.name != 'frontend'
        working-directory: ${{ matrix.service.path }}
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen
        working-directory: ${{ matrix.service.path }}
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ env.PROJECT_NAME }}-${{ matrix.service.name }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_AUDIENCE: ${{ secrets.ENTRA_AUDIENCE }}
        run: |
          docker build \
            --build-arg VITE_ENTRA_TENANT_ID=$ENTRA_TENANT_ID \
            --build-arg VITE_ENTRA_AUDIENCE=$ENTRA_AUDIENCE \
            --build-arg VITE_REDIRECT_URI="http://localhost:3000" \
            --build-arg VITE_API_BASE_URL="http://localhost:8095" \
            -t $REGISTRY/$REPO:latest -t $REGISTRY/$REPO:${{ github.sha }} .
          docker push $REGISTRY/$REPO:latest
          docker push $REGISTRY/$REPO:${{ github.sha }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Copiar docker-compose.prod.yml al EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.prod.yml"
        target: "/home/ubuntu" # Subimos el archivo a un lugar seguro primero

    - name: Desplegar en el EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: AWS_REGION,ECR_REGISTRY,ENTRA_TENANT_ID,ENTRA_AUDIENCE,DB_HOST,DB_USERNAME,DB_PASSWORD
        script: |
          # Asegurar que el directorio de la app existe y nos pertenece a nosotros
          sudo mkdir -p /home/ubuntu/app
          sudo chown -R ubuntu:ubuntu /home/ubuntu/app
          
          # Mover el archivo que acabamos de subir
          mv /home/ubuntu/docker-compose.prod.yml /home/ubuntu/app/docker-compose.yml
          
          cd /home/ubuntu/app
          cat <<EOF > .env
          ECR_REGISTRY=${ECR_REGISTRY}
          ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
          ENTRA_AUDIENCE=${ENTRA_AUDIENCE}
          DB_HOST=${DB_HOST}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          EOF
          
          # Instalar AWS CLI si no existe
          which aws || (sudo apt-get update && sudo apt-get install -y awscli)
          
          # Conectar a ECR y levantar contenedores
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}
            
          sudo docker compose pull
          sudo docker compose up -d
          sudo docker image prune -f


    - name: Desplegar en la instancia Frontend
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.FRONTEND_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: AWS_REGION,ECR_REGISTRY
        script: |
          # Instalar AWS CLI si no existe
          which aws || (sudo apt-get update && sudo apt-get install -y awscli)
          
          # Conectar a ECR
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}
          
          # Descargar y levantar el frontend
          sudo docker pull ${ECR_REGISTRY}/cloudnative-encargo-frontend:latest
          sudo docker rm -f frontend || true
          sudo docker run -d --name frontend -p 80:80 ${ECR_REGISTRY}/cloudnative-encargo-frontend:latest
          
          sudo docker image prune -f