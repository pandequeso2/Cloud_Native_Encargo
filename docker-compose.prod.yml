services:
  eureka-server:
    image: ${ECR_REGISTRY}/cloudnative-encargo-eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - backend

  notas-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-notas-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - eureka-server
      - kafka
    networks: [backend]

  asignaturas-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-asignaturas-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  profesores-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-profesores-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  grupos-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-grupos-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  integrantes-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-integrantes-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  roles-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-roles-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  secciones-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-secciones-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  trabajos-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-trabajos-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  entregas-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-entregas-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  comentarios-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-comentarios-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  rabbitmq-1:
    image: rabbitmq:4.2-management
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-secret_cookie_value}
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  rabbitmq-2:
    image: rabbitmq:4.2-management
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-secret_cookie_value}
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    networks:
      - backend

  rabbitmq-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-rabbitmq-service:latest
    container_name: rabbitmq-service
    environment:
      EUREKA_HOST: eureka-server
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8093:8093"
    networks:
      - backend


  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: production-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - backend

  kafka-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-kafka-service:latest
    container_name: kafka-service
    environment:
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka
      - eureka-server
    ports:
      - "8094:8094"
    networks:
      - backend
  gateway:
    image: ${ECR_REGISTRY}/cloudnative-encargo-gateway:latest
    ports:
      - "8095:8095"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
      - NOTAS_HOST=notas-service
      - ASIGNATURAS_HOST=asignaturas-service
      - PROFESORES_HOST=profesores-service
      - GRUPOS_HOST=grupos-service
      - INTEGRANTES_HOST=integrantes-service
      - ROLES_HOST=roles-service
      - SECCIONES_HOST=secciones-service
      - TRABAJOS_HOST=trabajos-service
      - ENTREGAS_HOST=entregas-service
      - COMENTARIOS_HOST=comentarios-service
      - RABBITMQ_SERVICE_HOST=rabbitmq-service
      - KAFKA_SERVICE_HOST=kafka-service
      - EUREKA_HOST=eureka-server
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_AUDIENCE=${ENTRA_AUDIENCE}
    depends_on: [eureka-server]
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  rabbitmq_data_1:
  rabbitmq_data_2:
  zookeeper_data:
  kafka_data:
