version: '3.8'

services:
  eureka-server:
    image: ${ECR_REGISTRY}/cloudnative-encargo-eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - backend

  notas-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-notas-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  asignaturas-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-asignaturas-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  profesores-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-profesores-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  grupos-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-grupos-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  integrantes-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-integrantes-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  roles-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-roles-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  secciones-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-secciones-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  trabajos-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-trabajos-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  entregas-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-entregas-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  comentarios-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-comentarios-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  rabbitmq-1:
    image: rabbitmq:4.2-management
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-secret_cookie_value}
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend

  rabbitmq-2:
    image: rabbitmq:4.2-management
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-secret_cookie_value}
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    networks:
      - backend

  rabbitmq-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-rabbitmq-service:latest
    container_name: rabbitmq-service
    environment:
      EUREKA_HOST: eureka-server
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8093:8093"
    networks:
      - backend

  gateway:
    image: ${ECR_REGISTRY}/cloudnative-encargo-gateway:latest
    ports:
      - "8095:8095"
    environment:
      - NOTAS_HOST=notas-service
      - ASIGNATURAS_HOST=asignaturas-service
      - PROFESORES_HOST=profesores-service
      - GRUPOS_HOST=grupos-service
      - INTEGRANTES_HOST=integrantes-service
      - ROLES_HOST=roles-service
      - SECCIONES_HOST=secciones-service
      - TRABAJOS_HOST=trabajos-service
      - ENTREGAS_HOST=entregas-service
      - COMENTARIOS_HOST=comentarios-service
      - RABBITMQ_SERVICE_HOST=rabbitmq-service
      - EUREKA_HOST=eureka-server
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_AUDIENCE=${ENTRA_AUDIENCE}
    depends_on: [eureka-server]
    networks: [backend]

  frontend:
    image: ${ECR_REGISTRY}/cloudnative-encargo-frontend:latest
    ports:
      - "80:80"
    depends_on: [gateway]
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  rabbitmq_data_1:
  rabbitmq_data_2: