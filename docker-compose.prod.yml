version: '3.8'

services:
  eureka-server:
    image: ${ECR_REGISTRY}/cloudnative-encargo-eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - backend

  notas-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-notas-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  asignaturas-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-asignaturas-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  profesores-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-profesores-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  grupos-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-grupos-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  integrantes-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-integrantes-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  roles-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-roles-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  secciones-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-secciones-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  trabajos-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-trabajos-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  entregas-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-entregas-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  comentarios-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-comentarios-service:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on: [eureka-server]
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  rabbitmq-service:
    image: ${ECR_REGISTRY}/cloudnative-encargo-rabbitmq-service:latest
    container_name: rabbitmq-service
    environment:
      EUREKA_HOST: eureka-server
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8093:8093"
    networks:
      - backend

  gateway:
    image: ${ECR_REGISTRY}/cloudnative-encargo-gateway:latest
    ports:
      - "8095:8095"
    environment:
      - NOTAS_HOST=notas-service
      - ASIGNATURAS_HOST=asignaturas-service
      - PROFESORES_HOST=profesores-service
      - GRUPOS_HOST=grupos-service
      - INTEGRANTES_HOST=integrantes-service
      - ROLES_HOST=roles-service
      - SECCIONES_HOST=secciones-service
      - TRABAJOS_HOST=trabajos-service
      - ENTREGAS_HOST=entregas-service
      - COMENTARIOS_HOST=comentarios-service
      - RABBITMQ_SERVICE_HOST=rabbitmq-service
      - EUREKA_HOST=eureka-server
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_AUDIENCE=${ENTRA_AUDIENCE}
    depends_on: [eureka-server]
    networks: [backend]

  frontend:
    image: ${ECR_REGISTRY}/cloudnative-encargo-frontend:latest
    ports:
      - "80:80"
    depends_on: [gateway]
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  rabbitmq_data: